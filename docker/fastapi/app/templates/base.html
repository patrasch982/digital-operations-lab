<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Digital Operations Lab{% endblock %}</title>

    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

<header class="header">

    <div class="header-left">

        <h1>🖥 Digital Operations Lab</h1>

        <p class="tagline">
            Raspberry Pi • Docker • FastAPI • PostgreSQL
        </p>

    </div>

    <div class="header-right">

        <div class="status">

            <span class="status-dot"></span>

            <span>ONLINE</span>

        </div>

    </div>

</header>

<main class="container">
    {% block content %}
    {% endblock %}
</main>

</body>
</html>
